<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management object</title>
</head>
<body>
  <script>
    const studentObj = {
      maths: 60,
      science: 72,
      english: 78,
      socialStudies: 87,
      averageMarks: 0,
    };

    function calculateAverage () {
      studentObj.averageMarks = (studentObj.maths + studentObj.science + studentObj.socialStudies + studentObj.english) / 4;
      console.log(studentObj);
      return studentObj.averageMarks
    };

    function addSubjectAndMarks (sub, marks) {
      studentObj[sub] = marks;
    }
    addSubjectAndMarks("IT", 78);
    console.log(calculateAverage());
  </script>
</body>
</html>
