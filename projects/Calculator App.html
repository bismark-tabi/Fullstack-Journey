};

function checkoutDevice (ledger, assetTag, borrower) {
  const updatedLedger = JSON.parse(JSON.stringify(ledger));

  if (updatedLedger[assetTag] && updatedLedger[assetTag].status !== "CheckedOut") {
    updatedLedger[assetTag].borrower = borrower;
    updatedLedger[assetTag].status = "CheckedOut";

    return {ledger: updatedLedger, message: `${updatedLedger[assetTag].borrower.name} borrowed ${updatedLedger[assetTag].type} from ${updatedLedger[assetTag]}` };
  } 
  else if (updatedLedger[assetTag] && updatedLedger[assetTag].status === "CheckedOut") {
    return {ledger: updatedLedger, message: `Asset Tag ${assetTag} is already Checked Out by ${updatedLedger[assetTag].borrower.name}`};
  }
  
  if (!updatedLedger[assetTag]) {
    return {ledger: updatedLedger, message: `Asset Tag ${assetTag} does not exist`};
  }
}

function checkinDevice(ledger, assetTag) {
  const updatedLedger = JSON.parse(JSON.stringify(ledger));

  if (updatedLedger[assetTag]) {
    updatedLedger[assetTag].borrower.name = "";
    updatedLedger[assetTag].borrower.email = "";
    updatedLedger[assetTag].dueDate = "";

    updatedLedger[assetTag].status = "CheckedIn";

    return {ledger: updatedLedger, message: `${assetTag} has been checked in.`};
  }


  if (!updatedLedger[assetTag]) {
    return {ledger: ledger, message: `${assetTag} was not found`};
  };
}

function listOverdueDevices (ledger, today) {
  const overdueDevices = [];

  for (assetTag in ledger) {
    const todayArr = today.split('/');
    const dueDateArr = ledger[assetTag].dueDate.split('/');
    let beforeToday = false;

    if (Number(dueDateArr[2]) === Number(todayArr[2]) ) {
      if (
        (Number(dueDateArr[1]) < Number(todayArr[1])) ||
        (Number(dueDateArr[0]) < Number(todayArr[0]))
      ) {
        beforeToday = true;
      }
    }
    
    if (Number(dueDateArr[2] )< Number(todayArr[2])) {
      beforeToday = true;
    }

    if (ledger[assetTag].status === "CheckedOut" && beforeToday) {
      overdueDevices.push(ledger[assetTag]);
    }
  }
  
  return overdueDevices;
}
