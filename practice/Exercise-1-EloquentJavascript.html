<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise-1- Eloquent JavaScript</title>
</head>
<body>
    <script>

    //FizzBuzz 
        for (let i = 0; i <= 100; i++) {
            if (i % 3 === 0 && i % 5 !== 0) {
                console.log("Fizz");
            } else if (i % 3 !== 0 && i % 5 === 0) {
                console.log("Buzz");
            } else if (i % 3 === 0 && i % 5 === 0) {
                console.log("FizzBuzz");
            } else {
                console.log(i);
            };
        };

    
    //Chessboard
        
    </script>
</body>
</html>
